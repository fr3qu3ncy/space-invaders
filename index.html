<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPACE INVADERS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #39ff14;
    --pink: #ff6ec7;
    --cyan: #00ffff;
    --yellow: #ffe600;
    --red: #ff3131;
    --bg: #0a0a0a;
    --font: 'Press Start 2P', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font);
    color: var(--green);
  }

  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* ── OVERLAY SCREENS ── */
  .overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    background: rgba(10,10,10,0.92);
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .title {
    font-size: clamp(1.2rem, 5vw, 2.4rem);
    color: var(--green);
    text-shadow: 0 0 10px var(--green), 0 0 30px var(--green);
    margin-bottom: 0.6em;
    text-align: center;
    line-height: 1.6;
  }

  .subtitle {
    font-size: clamp(0.5rem, 2vw, 0.8rem);
    color: var(--cyan);
    margin-bottom: 2em;
    text-align: center;
    line-height: 1.8;
  }

  .btn {
    font-family: var(--font);
    font-size: clamp(0.6rem, 2.5vw, 0.9rem);
    padding: 0.8em 1.6em;
    background: transparent;
    color: var(--green);
    border: 2px solid var(--green);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.15s;
    margin: 0.3em;
  }
  .btn:hover, .btn:active {
    background: var(--green);
    color: var(--bg);
    box-shadow: 0 0 15px var(--green);
  }

  .score-display {
    font-size: clamp(0.6rem, 2.5vw, 1rem);
    color: var(--yellow);
    margin: 0.5em 0;
  }

  .high-score {
    font-size: clamp(0.5rem, 2vw, 0.7rem);
    color: var(--pink);
    margin-top: 1em;
  }

  .level-announce {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: clamp(1rem, 4vw, 2rem);
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .level-announce.show { opacity: 1; }

  /* HUD */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex; justify-content: space-between;
    padding: 8px 12px;
    font-size: clamp(0.45rem, 1.8vw, 0.65rem);
    color: var(--green);
    text-shadow: 0 0 6px var(--green);
    pointer-events: none;
  }
  .hud.hidden { display: none; }

  /* Controls hint (game-start tutorial) */
  .controls-hint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
    padding: 0.4em 1em;
    background: transparent;
    color: var(--yellow);
    text-shadow: 0 1px 5px rgba(0,0,0,0.85);
    opacity: 1;
    transition: opacity 0.8s ease-out;
    pointer-events: none;
    white-space: nowrap;
    font-family: var(--font);
  }
  .controls-hint.hidden { display: none; }
  .controls-hint.fading { opacity: 0; }
  .controls-hint .hint-mobile,
  .controls-hint .hint-desktop { display: none; }
  .controls-hint.mode-mobile .hint-mobile,
  .controls-hint.mode-desktop .hint-desktop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35em;
  }
  .hint-word {
    font-size: clamp(0.5rem, 2vw, 0.75rem);
    font-weight: 700;
    letter-spacing: 0.18em;
  }
  .hint-symbol {
    font-size: clamp(1.7rem, 6vw, 2.5rem);
    line-height: 1;
  }
  .hint-spacebar {
    width: 2.8em;
    height: 1.1em;
    border: 2px solid var(--yellow);
    border-radius: 0.3em;
    box-sizing: border-box;
  }

  /* Scanline effect */
  .scanlines {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 4;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
  }

  /* CRT vignette */
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- HUD -->
<div class="hud hidden" id="hud">
  <span id="hudScore">SCORE: 0</span>
  <span id="hudLevel">LEVEL 1</span>
</div>

<!-- Level announcement -->
<div class="level-announce" id="levelAnnounce"></div>

<!-- Controls hint (shown at game start) -->
<div class="controls-hint hidden" id="controlsHint">
  <div class="hint-mobile">
    <span class="hint-word">SWIPE</span>
    <span class="hint-symbol">◄ ►</span>
    <span class="hint-word">MOVE</span>
  </div>
  <div class="hint-mobile">
    <span class="hint-word">TAP</span>
    <span class="hint-symbol">●</span>
    <span class="hint-word">SHOOT</span>
  </div>
  <div class="hint-desktop">
    <span class="hint-word">ARROW KEYS</span>
    <span class="hint-symbol">◄ ►</span>
    <span class="hint-word">MOVE</span>
  </div>
  <div class="hint-desktop">
    <span class="hint-word">SPACE BAR</span>
    <span class="hint-symbol hint-spacebar"></span>
    <span class="hint-word">SHOOT</span>
  </div>
</div>

<!-- MENU SCREEN -->
<div class="overlay" id="menuScreen">
  <div class="title">SPACE<br>INVADERS</div>
  <div class="subtitle">
    SWIPE LEFT SIDE TO MOVE<br>
    TAP RIGHT SIDE TO SHOOT<br>
    DESTROY ALL INVADERS
  </div>
  <button class="btn" id="btnStart">START GAME</button>
  <div class="high-score" id="menuHighScore"></div>
</div>

<!-- GAME OVER SCREEN -->
<div class="overlay hidden" id="gameOverScreen">
  <div class="title" style="color:var(--red);text-shadow:0 0 10px var(--red),0 0 30px var(--red);">GAME<br>OVER</div>
  <div class="score-display" id="finalScore">SCORE: 0</div>
  <div class="score-display" id="finalLevel">LEVEL: 1</div>
  <div class="high-score" id="goHighScore"></div>
  <button class="btn" id="btnRestart">PLAY AGAIN</button>
  <button class="btn" id="btnMenu">MENU</button>
</div>

<script>
// ═══════════════════════════════════════
//  SPACE INVADERS — Mobile-First Retro
// ═══════════════════════════════════════

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ── DOM refs ──
const hudEl = document.getElementById('hud');
const hudScore = document.getElementById('hudScore');
const hudLevel = document.getElementById('hudLevel');
const menuScreen = document.getElementById('menuScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const levelAnnounce = document.getElementById('levelAnnounce');
const menuHighScore = document.getElementById('menuHighScore');
const goHighScore = document.getElementById('goHighScore');
const finalScore = document.getElementById('finalScore');
const finalLevel = document.getElementById('finalLevel');

// ── Game constants ──
const GAME = {
  touchSpeed: 15,          // touch-swipe speed (field px/frame, x dt)
  keyboardMax: 12,         // desktop arrow-key top speed (field px/frame)
  keyboardEase: 0.05,      // slow per-frame ramp: light tap = tiny nudge, held ~1s = full speed
  bulletSpeed: 8,
  invaderBaseSpeed: 6,    // px per move tick; effective L1 speed = base/moveInterval ≈ 0.75px/frame
  invaderDrop: 12,
  invaderShootChance: 0.002,
  bulletHitRadius: 8,
  lives: 3,
  starCount: 80,
};

// ── Pixel art sprites (8x8 grids) ──
// Each sprite is an array of 8 strings, each 8 chars: 1=draw, 0=empty
const SPRITES = {
  invader1: [
    '00100100',
    '01111110',
    '11011011',
    '11111111',
    '10111101',
    '00100100',
    '01010100',
    '10000001',
  ],
  invader2: [
    '00111100',
    '00011000',
    '01111110',
    '11011011',
    '11111111',
    '00100100',
    '01000001',
    '10000001',
  ],
  invader3: [
    '00011000',
    '00111100',
    '01111110',
    '11011011',
    '11111111',
    '00011000',
    '00100100',
    '01000001',
  ],
  player: [
    '00001000',
    '00111100',
    '01111110',
    '11111111',
    '11111111',
    '11111111',
    '11111111',
    '11111111',
  ],
  ufo: [
    '00011000',
    '00111100',
    '01101110',
    '11111111',
    '10111101',
    '00100100',
  ],
};

const INVADER_COLORS = ['#ff6ec7', '#00ffff', '#ffe600'];
const INVADER_POINTS = [30, 20, 10];

// ── Shield bunker shape (classic arch) ──
// 11 x 8 grid; bottom-centre notch = the arch opening
const SHIELD_COLS = 11, SHIELD_ROWS = 8;
const SHIELD_TEMPLATE = [
  '00111111100',
  '01111111110',
  '11111111111',
  '11111111111',
  '11111111111',
  '11000000011',
  '11000000011',
  '11000000011',
];
function makeShieldGrid() {
  return SHIELD_TEMPLATE.map(row => row.split('').map(ch => (ch === '1' ? 1 : 0)));
}

// ── Game state ──
let state = {
  running: false,
  score: 0,
  level: 1,
  lives: GAME.lives,
  player: { x: 0, y: 0, w: 0, h: 0 },
  invaders: [],
  bullets: [],
  enemyBullets: [],
  particles: [],
  stars: [],
  invaderDir: 1,
  invaderSpeed: GAME.invaderBaseSpeed,
  invaderFrame: 0,
  invaderFrameTimer: 0,
  ufo: null,
  ufoTimer: 0,
  shootCooldown: 0,
  playerInvincible: 0,
  shakeTimer: 0,
  shakeIntensity: 0,
};

// ── Touch handling ──
// Left half of screen: swipe to move. Right half: tap to shoot.
let touches = {};
let touchMoveDir = 0;   // driven by left-side swipe
let keyMoveDir = 0;     // driven by desktop arrow keys
let keyVel = 0;         // eased keyboard velocity (field px/frame)
let shootRequested = false;

// ── Audio context for retro sounds ──
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(freq, duration, type = 'square', volume = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function sfxShoot() { playSound(880, 0.08, 'square', 0.08); }
function sfxHit() { playSound(220, 0.15, 'sawtooth', 0.1); }
function sfxExplode() { playSound(80, 0.3, 'sawtooth', 0.12); }
function sfxUfo() { playSound(600, 0.05, 'sine', 0.04); }
function sfxPlayerHit() { playSound(120, 0.5, 'sawtooth', 0.15); }
function sfxLevelUp() {
  playSound(523, 0.1, 'square', 0.08);
  setTimeout(() => playSound(659, 0.1, 'square', 0.08), 100);
  setTimeout(() => playSound(784, 0.15, 'square', 0.08), 200);
}

// ── Fixed play field (1200 x 1000 logical px), scaled + centred ──
// All game logic runs in FIELD units so the game feels identical on any screen.
const FIELD_W = 1200, FIELD_H = 1000;
const PIXEL = 8;   // logical sprite cell size — constant, screen-independent
let W, H, scale = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  dpr = Math.min(dpr, 2);  // cap backing store: 3x phones don't need it, and filling 3x pixels per frame is a real cost
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  scale = Math.min(W / FIELD_W, H / FIELD_H);
  ox = (W - FIELD_W * scale) / 2;
  oy = (H - FIELD_H * scale) / 2;
  state.player.w = 8 * PIXEL;
  state.player.h = 8 * PIXEL;
  state.player.y = FIELD_H - 88;   // sits just above the ground line (FIELD_H - 20)
  if (state.stars.length) initStars();  // re-scatter stars for the new screen size
  layoutShields(false);
}
window.addEventListener('resize', resize);
resize();

// ── Stars background ──
function initStars() {
  state.stars = [];
  for (let i = 0; i < GAME.starCount; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      brightness: Math.random(),
    });
  }
}

function updateStars(dt) {
  for (const s of state.stars) {
    s.y += s.speed * dt;
    s.brightness += (Math.random() - 0.5) * 0.05;
    s.brightness = Math.max(0.2, Math.min(1, s.brightness));
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function drawStars() {
  for (const s of state.stars) {
    ctx.fillStyle = `rgba(255,255,255,${s.brightness * 0.5})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
}

// ── Sprite drawing ──
// Sprites are pre-rendered ONCE into offscreen canvases (PIXEL is constant),
// so every frame is a single GPU blit per sprite instead of ~40-64 fillRects.
// This is the big mobile frame-rate win.
const spriteCache = new Map();
function getSpriteCanvas(sprite, color) {
  let byColor = spriteCache.get(sprite);
  if (!byColor) { byColor = new Map(); spriteCache.set(sprite, byColor); }
  let c = byColor.get(color);
  if (!c) {
    const rows = sprite.length, cols = sprite[0].length;
    c = document.createElement('canvas');
    c.width = cols * PIXEL; c.height = rows * PIXEL;
    const sctx = c.getContext('2d');
    sctx.fillStyle = color;
    for (let row = 0; row < rows; row++)
      for (let col = 0; col < cols; col++)
        if (sprite[row][col] === '1') sctx.fillRect(col * PIXEL, row * PIXEL, PIXEL, PIXEL);
    byColor.set(color, c);
  }
  return c;
}
function drawSprite(sprite, x, y, color, ps = PIXEL) {
  ctx.drawImage(getSpriteCanvas(sprite, color), x, y, sprite[0].length * ps, sprite.length * ps);
}

// ── Particles ──
function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    state.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.03 + 0.02,
      color,
      size: Math.random() * 3 + 1,
    });
  }
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of state.particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ── Level setup ──
function setupLevel() {
  const rows = Math.min(5, 3 + Math.floor(state.level / 3));
  const cols = Math.min(9, 6 + Math.floor(state.level / 2));
  state.invaders = [];
  state.bullets = [];
  state.enemyBullets = [];
  state.invaderDir = 1;
  state.invaderSpeed = GAME.invaderBaseSpeed + (state.level - 1) * 0.25; // gentle ramp: L1 ~45px/s, L10 ~165, L20 ~215
  state.invaderMoveCounter = 0;
  state.ufo = null;
  state.ufoTimer = 600 + Math.random() * 600;

  const invaderW = 8 * PIXEL;
  const invaderH = 8 * PIXEL;
  const gap = Math.max(12, FIELD_W * 0.025);
  const totalW = cols * (invaderW + gap);
  const startX = (FIELD_W - totalW) / 2 + 10;
  const startY = 80;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const spriteIdx = r < 1 ? 2 : r < 3 ? 1 : 0;
      state.invaders.push({
        x: startX + c * (invaderW + gap),
        y: startY + r * (invaderH + 14),
        w: invaderW,
        h: invaderH,
        spriteIdx,
        alive: true,
      });
    }
  }
}

// ── Shield bunkers ──
// Grids (with their damage) live in state.shieldGrids and persist across
// levels and resizes; only a new game resets them.
function layoutShields(fresh) {
  const block = PIXEL * 2;
  if (fresh || !state.shieldGrids || !state.shieldGrids.length) {
    const n = FIELD_W >= 600 ? 4 : 3;
    state.shieldGrids = Array.from({ length: n }, makeShieldGrid);
  }

  const n = state.shieldGrids.length;
  const archW = SHIELD_COLS * block;
  const archH = SHIELD_ROWS * block;
  const gap = (FIELD_W - n * archW) / (n + 1);
  state.shields = state.shieldGrids.map((grid, i) => ({
    x: gap + i * (archW + gap),
    y: FIELD_H - 140 - archH,   // bunker sits well above the player ship
    block,
    grid,
  }));
}

// Bullet vs shield: destroys exactly one block, bullet is consumed
function bulletHitsShield(b) {
  for (const s of state.shields) {
    for (let r = 0; r < SHIELD_ROWS; r++) {
      for (let c = 0; c < SHIELD_COLS; c++) {
        if (!s.grid[r][c]) continue;
        const bx = s.x + c * s.block;
        const by = s.y + r * s.block;
        if (b.x < bx + s.block && b.x + b.w > bx && b.y < by + s.block && b.y + b.h > by) {
          s.grid[r][c] = 0;
          spawnParticles(bx + s.block / 2, by + s.block / 2, '#39ff14', 8);
          sfxHit();
          return true;
        }
      }
    }
  }
  return false;
}

// Invader vs shield: eats the blocks it touches
function invaderHitsShield(inv) {
  let touched = false;
  for (const s of state.shields) {
    for (let r = 0; r < SHIELD_ROWS; r++) {
      for (let c = 0; c < SHIELD_COLS; c++) {
        if (!s.grid[r][c]) continue;
        const bx = s.x + c * s.block;
        const by = s.y + r * s.block;
        if (inv.x < bx + s.block && inv.x + inv.w > bx && inv.y < by + s.block && inv.y + inv.h > by) {
          s.grid[r][c] = 0;
          touched = true;
        }
      }
    }
  }
  return touched;
}

function drawShields() {
  for (const s of state.shields) {
    ctx.fillStyle = '#39ff14';
    for (let r = 0; r < SHIELD_ROWS; r++) {
      for (let c = 0; c < SHIELD_COLS; c++) {
        if (!s.grid[r][c]) continue;
        ctx.fillRect(s.x + c * s.block + 1, s.y + r * s.block + 1, s.block - 2, s.block - 2);
      }
    }
  }
}

// Small life icons (player sprites) top-centre, 2.5x the HUD text height,
// sitting in the HUD row between SCORE and LEVEL (screen space, not field space)
function drawLives() {
  const n = Math.max(0, state.lives);
  if (!n) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let fs = 10;
  try { fs = parseFloat(getComputedStyle(hudScore).fontSize) || 10; } catch (e) {}
  const iconPx = Math.max(16, Math.min(40, Math.round(fs * 2.5)));
  const ps = iconPx / 8;
  const gapPx = Math.round(iconPx * 0.5);
  const totalW = n * iconPx + (n - 1) * gapPx;
  const x0 = (W - totalW) / 2;
  const y0 = 6;
  for (let i = 0; i < n; i++) {
    drawSprite(SPRITES.player, x0 + i * (iconPx + gapPx), y0, '#39ff14', ps);
  }
}

// ── Game init ──
function initGame() {
  state.score = 0;
  state.level = 1;
  state.lives = GAME.lives;
  layoutShields(true);
  state.player.x = FIELD_W / 2 - state.player.w / 2;
  keyVel = 0;
  state.playerInvincible = 60;
  state.shootCooldown = 0;
  initStars();
  setupLevel();
  announceLevel();
}

function announceLevel() {
  levelAnnounce.textContent = `LEVEL ${state.level}`;
  levelAnnounce.classList.add('show');
  sfxLevelUp();
  setTimeout(() => levelAnnounce.classList.remove('show'), 1500);
}

// ── High score ──
function getHighScore() {
  try { return parseInt(localStorage.getItem('si_highscore') || '0'); } catch { return 0; }
}
function setHighScore(s) {
  try { localStorage.setItem('si_highscore', s); } catch {}
}
function updateHighScoreUI() {
  const hs = getHighScore();
  menuHighScore.textContent = hs > 0 ? `HIGH SCORE: ${hs}` : '';
  goHighScore.textContent = hs > 0 ? `HIGH SCORE: ${hs}` : '';
}

// ── Collision ──
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── Main update ──
function update(dt) {
  if (!state.running) return;

  // Player movement: touch swipe (left half) is instant; keyboard eases in
  let vx = 0;
  if (touchMoveDir !== 0) {
    vx = touchMoveDir * GAME.touchSpeed * dt;
    keyVel = 0;
  } else if (keyMoveDir !== 0) {
    // Subtle ramp-up: velocity eases toward max, so a light tap nudges
    // and a held key reaches full speed. Release = instant stop.
    keyVel += (keyMoveDir * GAME.keyboardMax - keyVel) * Math.min(1, GAME.keyboardEase * dt);
    if (Math.abs(keyVel) < 0.01) keyVel = 0;
    vx = keyVel;
  } else {
    keyVel = 0;
  }
  if (vx !== 0) state.player.x += vx;
  state.player.x = Math.max(0, Math.min(FIELD_W - state.player.w, state.player.x));

  // Shooting
  if (state.shootCooldown > 0) state.shootCooldown -= dt;
  if (shootRequested && state.shootCooldown <= 0) {
    state.bullets.push({
      x: state.player.x + state.player.w / 2 - 2,
      y: state.player.y - 4,
      w: 4, h: 10,
    });
    state.shootCooldown = 15;
    sfxShoot();
    shootRequested = false;
  }

  // Player invincibility
  if (state.playerInvincible > 0) state.playerInvincible -= dt;

  // Screen shake
  if (state.shakeTimer > 0) state.shakeTimer -= dt;

  // Update bullets
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.y -= GAME.bulletSpeed * dt;
    if (b.y + b.h < 0) { state.bullets.splice(i, 1); continue; }

    // Check shield hits (destroys one block, bullet consumed)
    if (bulletHitsShield(b)) { state.bullets.splice(i, 1); continue; }

    // Check invader hits
    let hit = false;
    for (const inv of state.invaders) {
      if (!inv.alive) continue;
      if (rectsOverlap(b, inv)) {
        inv.alive = false;
        state.score += INVADER_POINTS[inv.spriteIdx];
        spawnParticles(inv.x + inv.w/2, inv.y + inv.h/2, INVADER_COLORS[inv.spriteIdx], 15);
        sfxHit();
        hit = true;
        break;
      }
    }
    if (hit) { state.bullets.splice(i, 1); continue; }

    // Check UFO hit
    if (state.ufo && rectsOverlap(b, state.ufo)) {
      const pts = [50, 100, 150, 300][Math.floor(Math.random()*4)];
      state.score += pts;
      spawnParticles(state.ufo.x + state.ufo.w/2, state.ufo.y + state.ufo.h/2, '#ff3131', 20);
      sfxExplode();
      state.ufo = null;
      state.bullets.splice(i, 1);
    }
  }

  // Update enemy bullets
  for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
    const b = state.enemyBullets[i];
    b.y += (b.speed || 3) * dt;
    if (b.y > FIELD_H) { state.enemyBullets.splice(i, 1); continue; }

    // Check shield hits (destroys one block, bullet consumed)
    if (bulletHitsShield(b)) { state.enemyBullets.splice(i, 1); continue; }

    // Hit player
    if (state.playerInvincible <= 0 && rectsOverlap(b, state.player)) {
      state.lives--;
      state.playerInvincible = 90;
      state.shakeTimer = 15;
      state.shakeIntensity = 6;
      spawnParticles(state.player.x + state.player.w/2, state.player.y + state.player.h/2, '#39ff14', 20);
      sfxPlayerHit();
      state.enemyBullets.splice(i, 1);
      if (state.lives <= 0) {
        gameOver();
        return;
      }
      continue;
    }
  }

  // Update invaders
  const aliveInvaders = state.invaders.filter(i => i.alive);
  if (aliveInvaders.length === 0) {
    state.level++;
    setupLevel();
    announceLevel();
    return;
  }

  // Frame throttle: invaders only move every N frames
  const moveInterval = Math.max(3, 9 - state.level);
  state.invaderMoveCounter += dt;
  if (state.invaderMoveCounter < moveInterval) {
    // Still update particles, UFO, etc. below
  } else {
    state.invaderMoveCounter = 0;

    // Speed up as fewer invaders remain
    const speedMult = 1 + (state.invaders.length - aliveInvaders.length) / state.invaders.length * 1.5;
    const moveAmount = state.invaderSpeed * speedMult * state.invaderDir;

    let needDrop = false;
    for (const inv of aliveInvaders) {
      const ox = inv.x, oy = inv.y;
      inv.x += moveAmount;
      if (inv.x <= 4 || inv.x + inv.w >= FIELD_W - 4) needDrop = true;
      if (invaderHitsShield(inv)) { inv.x = ox; inv.y = oy; }
    }

    if (needDrop) {
      state.invaderDir *= -1;
      for (const inv of aliveInvaders) {
        const oy = inv.y;
        inv.y += GAME.invaderDrop;
        if (invaderHitsShield(inv)) { inv.y = oy; continue; }
        // Check if invaders reached player level
        if (inv.y + inv.h >= state.player.y) {
          state.lives = 0;
          gameOver();
          return;
        }
      }
    }
  }

  // Invader shooting
  if (Math.random() < GAME.invaderShootChance * (1 + state.level * 0.3)) {
    const shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
    if (shooter) {
      state.enemyBullets.push({
        x: shooter.x + shooter.w / 2 - 2,
        y: shooter.y + shooter.h,
        w: 4, h: 8,
        speed: 2 + state.level * 0.3,
      });
    }
  }

  // Invader animation frame
  state.invaderFrameTimer += dt;
  if (state.invaderFrameTimer > 30) {
    state.invaderFrame = (state.invaderFrame + 1) % 2;
    state.invaderFrameTimer = 0;
  }

  // UFO
  state.ufoTimer -= dt;
  if (!state.ufo && state.ufoTimer <= 0) {
    const fromLeft = Math.random() > 0.5;
    state.ufo = {
      x: fromLeft ? -40 : FIELD_W + 10,
      y: 40,
      w: 8 * PIXEL,
      h: 6 * PIXEL,
      speed: fromLeft ? 2 : -2,
    };
    state.ufoTimer = 800 + Math.random() * 800;
  }
  if (state.ufo) {
    state.ufo.x += state.ufo.speed * dt;
    if (state.ufo.x < -60 || state.ufo.x > FIELD_W + 20) state.ufo = null;
    if (Math.random() < 0.1) sfxUfo();
  }

  // Update HUD
  hudScore.textContent = `SCORE: ${state.score}`;
  hudLevel.textContent = `LEVEL ${state.level}`;

  updateParticles(dt);
  updateStars(dt);
}

// ── Draw ──
function draw() {
  // Screen space: background + stars (dpr-aware so HiDPI phones stay sharp)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  // Play field: fixed 1200x1000, scaled to fit and centred on screen
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);

  // Screen shake
  if (state.shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * state.shakeIntensity;
    const sy = (Math.random() - 0.5) * state.shakeIntensity;
    ctx.translate(sx, sy);
  }

  // Subtle field border
  ctx.strokeStyle = 'rgba(57,255,20,0.25)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, FIELD_W - 2, FIELD_H - 2);

  // Invaders
  for (const inv of state.invaders) {
    if (!inv.alive) continue;
    const spriteKey = inv.spriteIdx === 0
      ? (state.invaderFrame === 0 ? 'invader1' : 'invader1')
      : inv.spriteIdx === 1
      ? (state.invaderFrame === 0 ? 'invader2' : 'invader2')
      : (state.invaderFrame === 0 ? 'invader3' : 'invader3');
    drawSprite(SPRITES[inv.spriteIdx === 0 ? 'invader1' : inv.spriteIdx === 1 ? 'invader2' : 'invader3'],
      inv.x, inv.y, INVADER_COLORS[inv.spriteIdx]);
  }

  // Shield bunkers
  drawShields();

  // UFO
  if (state.ufo) {
    drawSprite(SPRITES.ufo, state.ufo.x, state.ufo.y, '#ff3131');
  }

  // Player
  if (state.playerInvincible <= 0 || Math.floor(state.playerInvincible / 4) % 2 === 0) {
    drawSprite(SPRITES.player, state.player.x, state.player.y, '#39ff14');
  }

  // Player bullets
  ctx.fillStyle = '#39ff14';
  for (const b of state.bullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Glow
    ctx.fillStyle = 'rgba(57,255,20,0.3)';
    ctx.fillRect(b.x - 2, b.y, b.w + 4, b.h);
    ctx.fillStyle = '#39ff14';
  }

  // Enemy bullets
  for (const b of state.enemyBullets) {
    ctx.fillStyle = '#ff6ec7';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,110,199,0.3)';
    ctx.fillRect(b.x - 1, b.y, b.w + 2, b.h);
    ctx.fillStyle = '#ff6ec7';
  }

  // Ground line (field space, so it stays anchored to the field on any screen)
  ctx.strokeStyle = 'rgba(57,255,20,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, FIELD_H - 20);
  ctx.lineTo(FIELD_W, FIELD_H - 20);
  ctx.stroke();

  drawParticles();
  ctx.restore();

  // Lives: small player sprites, top-centre of screen (in the HUD row)
  if (state.running) drawLives();
}

// ── Game loop ──
// Delta-time: every speed/timer above is scaled by dt (a 60fps frame = 1), so the
// game runs at the same real-time speed even when the frame rate drops on mobile
// instead of literally playing slower.
let lastFrameT = 0;
function gameLoop(t) {
  t = t || performance.now();
  let dt = lastFrameT ? (t - lastFrameT) / (1000 / 60) : 1;
  lastFrameT = t;
  if (dt > 3) dt = 3;  // cap: don't teleport entities after a tab switch / long hitch
  if (dt < 0) dt = 0;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// ── Game over ──
function gameOver() {
  state.running = false;
  hudEl.classList.add('hidden');
  clearTimeout(hintTimer);
  controlsHint.classList.add('hidden');
  sfxExplode();
  if (state.score > getHighScore()) setHighScore(state.score);
  updateHighScoreUI();
  finalScore.textContent = `SCORE: ${state.score}`;
  finalLevel.textContent = `LEVEL: ${state.level}`;
  gameOverScreen.classList.remove('hidden');
}

// ── Touch handling (split halves) ──
// Left half  → horizontal swipe moves the player
// Right half → tap fires a bullet
function touchSide(t) { return t.clientX < W / 2 ? 'left' : 'right'; }
function leftTouchesActive() { return Object.values(touches).some(t => t.side === 'left'); }

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  for (const t of e.changedTouches) {
    touches[t.identifier] = {
      x: t.clientX, y: t.clientY,
      startX: t.clientX, startY: t.clientY,
      side: touchSide(t),
    };
  }
  // Right-half taps shoot; left half is for swiping only
  let shoot = false;
  for (const t of e.changedTouches) {
    if (touchSide(t) === 'right') { shoot = true; break; }
  }
  if (shoot) shootRequested = true;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  let dir = 0;
  let leftActive = false;
  for (const t of e.changedTouches) {
    const touch = touches[t.identifier];
    if (!touch) continue;
    touch.x = t.clientX;
    touch.y = t.clientY;
    if (touch.side !== 'left') continue;
    leftActive = true;
    const dx = t.clientX - touch.startX;
    if (Math.abs(dx) > 5) {
      dir = dx > 0 ? 1 : -1;
      touch.startX = t.clientX;
      touch.startY = t.clientY;
    }
  }
  // Only update movement if a left-side finger actually moved this event
  if (leftActive) touchMoveDir = dir;
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    delete touches[t.identifier];
  }
  if (!leftTouchesActive()) touchMoveDir = 0;
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// Keyboard fallback for desktop testing
const keys = {};
window.addEventListener('keydown', (e) => {
  initAudio();
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp') shootRequested = true;
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// ── Button handlers ──
const controlsHint = document.getElementById('controlsHint');
let hintTimer = null;

function showControlsHint() {
  // Detect mode
  const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const isPortrait = window.innerHeight > window.innerWidth;
  const mode = isTouch ? 'mobile' : 'desktop';
  controlsHint.className = 'controls-hint mode-' + mode;

  // Position: portrait mobile → below field; landscape mobile & desktop → centred
  if (isTouch && isPortrait) {
    const fieldBottom = oy + FIELD_H * scale;
    controlsHint.style.top = Math.min(fieldBottom + 8, window.innerHeight - controlsHint.offsetHeight - 4) + 'px';
    controlsHint.style.transform = 'translateX(-50%)';
  } else {
    controlsHint.style.top = '50%';
    controlsHint.style.transform = 'translate(-50%, -50%)';
  }

  // Reset & show
  controlsHint.classList.remove('hidden', 'fading');
  // Force reflow so the transition fires if it was just un-hidden
  void controlsHint.offsetWidth;

  // 5s visible, then fade out over 0.8s
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    controlsHint.classList.add('fading');
    setTimeout(() => controlsHint.classList.add('hidden'), 850);
  }, 5000);
}

document.getElementById('btnStart').addEventListener('click', () => {
  initAudio();
  menuScreen.classList.add('hidden');
  hudEl.classList.remove('hidden');
  initGame();
  state.running = true;
  showControlsHint();
});

document.getElementById('btnRestart').addEventListener('click', () => {
  gameOverScreen.classList.add('hidden');
  hudEl.classList.remove('hidden');
  initGame();
  state.running = true;
  showControlsHint();
});

document.getElementById('btnMenu').addEventListener('click', () => {
  gameOverScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
  hudEl.classList.add('hidden');
  state.running = false;
  clearTimeout(hintTimer);
  controlsHint.classList.add('hidden');
  updateHighScoreUI();
});

// ── Start ──
updateHighScoreUI();
initStars();
gameLoop();

// Keyboard movement (desktop) — poll held keys ~60fps
setInterval(() => {
  if (!state.running) return;
  if (keys['ArrowLeft'] || keys['a']) keyMoveDir = -1;
  else if (keys['ArrowRight'] || keys['d']) keyMoveDir = 1;
  else keyMoveDir = 0;
}, 16);

</script>
